{% extends "base.html" %}

{% block title %}Upload Business Data - AI BI Assistant{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-md-5">

                    <h2 class="fw-bold mb-2">
                        📂 Upload Business Data
                    </h2>

                    <p class="text-muted mb-4">
                        Upload a CSV or Excel file to review its structure, quality, and key measures.
                    </p>

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                        action="{{ url_for('data.upload') }}"
                    >
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Select a File (.csv, .xlsx, .xls)
                            </label>

                            <input
                                type="file"
                                name="file"
                                class="form-control form-control-lg fs-6"
                                accept=".csv,.xlsx,.xls"
                                required
                            >
                            <div class="form-text mt-2 text-muted">
                                Supported formats: CSV and Excel (.xlsx, .xls).
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button
                                type="submit"
                                class="btn btn-primary px-4 py-2 shadow-sm"
                            >
                                Upload and Review Data
                            </button>

                            <a
                                href="{{ url_for('main.dashboard') }}"
                                class="btn btn-outline-secondary px-4 py-2"
                            >
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
{% endblock %}
