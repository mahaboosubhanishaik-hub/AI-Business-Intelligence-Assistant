{% extends "base.html" %}

{% block title %}Page Not Found - AI Business Intelligence Assistant{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-5 my-4">
                <div class="display-1 text-primary fw-bold mb-3">404</div>
                <h2 class="fw-bold mb-3">We could not find that page</h2>
                <p class="text-muted mb-4">
                    Check the address or return to the home page.
                </p>
                <div>
                    <a href="{{ url_for('main.home') }}" class="btn btn-primary px-4 me-2">
                        Home
                    </a>
                    {% if current_user.is_authenticated %}
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary px-4">
                            Dashboard
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
