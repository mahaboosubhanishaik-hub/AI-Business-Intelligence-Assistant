{% extends "base.html" %}

{% block title %}Login - AI Business Intelligence Assistant{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5 col-lg-4">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-3">
                        <img
                            src="{{ url_for('static', filename='images/AIBIlogo.png') }}"
                            alt="AI BI Logo"
                            style="height: 75px; width: auto; object-fit: contain;"
                        >
                    </div>

                    <h2 class="text-center fw-bold mb-4">
                        Sign In
                    </h2>

                    <form
                        method="POST"
                        action="{{ url_for('auth.login') }}"
                    >

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Email Address
                            </label>
                            <input
                                type="email"
                                name="email"
                                class="form-control form-control-lg fs-6"
                                placeholder="name@example.com"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Password
                            </label>
                            <input
                                type="password"
                                name="password"
                                class="form-control form-control-lg fs-6"
                                placeholder="••••••••"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100 fs-6 shadow-sm"
                        >
                            Sign In
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted">Don't have an account?</span>
                        <a
                            href="{{ url_for('auth.register') }}"
                            class="fw-semibold text-decoration-none ms-1"
                        >
                            Create an account
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
{% endblock %}
